<style>
/* Version 2. Everything still is from Blender: the desk (desk-backdrop.jpg), the
   studio light (env.json), the buttons (desk-ui-*.png) and the numerals
   (night-glyph-*.png). The jar and hourglass are the Blender models with their
   creases' shadows baked in, lit live so they can be turned. Night clay palette,
   one dark look on purpose. */
:root {
  --night: #0d0c0f;
  --ivory: #ece6da;
  --dim: #a39d93;
  --faint: #78736b;
  --sheet: #1b1a1e;
  --line: #2f2d34;
  --terra: #d9774e;
  --good: #9cc188;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; margin: 0; }
body { background: var(--night); color: var(--ivory); font-family: var(--body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--terra); outline-offset: 3px; border-radius: 28px; }
/* The phone column: the desk picture is drawn for a phone's shape, so wide
   screens get a phone-shaped column on black. */
#app { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 62vh); overflow: hidden; }
#stage { position: absolute; inset: 0; touch-action: none; background: var(--night) url(desk-backdrop.jpg) center / auto 100% no-repeat; }
#stage canvas { display: block; width: 100%; height: 100%; }
.ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px); }
.head { display: flex; flex-direction: column; gap: 2px; }
.head .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 800; }
.sub { color: var(--dim); font-size: 15px; font-weight: 500; }
.macros { display: flex; gap: 14px; color: var(--dim); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
.macros i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }
.tag { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #c9a46a; border: 1px solid #c9a46a55; border-radius: 6px; padding: 2px 6px; font-weight: 700; }
/* The hero number is set from rendered clay numerals. */
.hero { position: relative; height: 66px; margin: 6px 0 2px; }
.hero img { position: absolute; pointer-events: none; }
.hero .alt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.coach { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 3px; margin-top: -4px; }
.coach .puck { position: relative; width: 52px; height: 52px; }
.coach .puck img { position: absolute; pointer-events: none; }
.coach .puck svg { position: absolute; left: 14px; top: 13px; }
.coach span { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.coach:active .puck .up { visibility: hidden; }
.coach .puck .down { visibility: hidden; }
.coach:active .puck .down { visibility: visible; }
.coach:active svg { transform: translateY(2px); }
.foot { pointer-events: auto; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.controls { display: flex; flex-direction: column; gap: 12px; }
.row3 { display: flex; gap: 10px; justify-content: center; }
.row3 > * { flex: 1; }
/* clay controls: sizes come from desk-ui.json at load (see skinClay) */
.clay { position: relative; display: flex; align-items: center; justify-content: center; white-space: nowrap; font-weight: 800; }
.clay.primary { color: #221f24; font-size: 17px; }
.clay.soft, .clay.chip { color: var(--ivory); font-size: 15px; }
.clay.chip.on { color: #221f24; }
.clay small { font-weight: 600; opacity: .7; margin-left: 4px; }
.clay[disabled] { opacity: .45; }
.tabs { position: relative; height: 68px; }
.tabs .slot { position: absolute; inset: 6px; display: flex; }
.pic { position: absolute; pointer-events: none; box-sizing: border-box; }
.tabs button { flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; color: var(--dim); position: relative; z-index: 1; }
.tabs button span { font-size: 11px; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
.tabs button[aria-pressed="true"] { color: var(--ivory); }
.tabs button[aria-pressed="true"] span { color: var(--dim); }

.hint { position: absolute; left: 50%; transform: translate(-50%, 0); top: 68.5%; display: flex; align-items: center; gap: 8px; background: #0d0c0fcc; border: 1px solid var(--line); color: var(--ivory); font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 999px; pointer-events: none; white-space: nowrap; transition: opacity .4s; }
.hint.gone { opacity: 0; }
.hint svg { flex: none; }
#bodyView { position: absolute; left: 16px; right: 16px; top: 31%; pointer-events: auto; }
.card { background: #19181bee; border: 1px solid var(--line); border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 1px 0 #ffffff10, 0 18px 30px #000a; }
.card svg text { fill: var(--dim); font-size: 10px; font-family: var(--body); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: #232227; border-radius: 16px; padding: 10px 12px; box-shadow: inset 0 1px 0 #ffffff0d; }
.stat b { display: block; font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
/* sheets */
.scrim { position: absolute; inset: 0; background: #000a; z-index: 19; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--sheet); border-radius: 28px 28px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  transform: translateY(105%); max-height: 78%; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 1px 0 #ffffff14, 0 -16px 40px #000c; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #3a3840; margin: 0 auto 2px; flex: none; }
.sheet h2 { margin: 0; font-size: 20px; font-weight: 800; }
.sheet .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet .x { min-width: 44px; min-height: 44px; display: grid; place-items: center; color: var(--dim); border-radius: 22px; }
.sheet .note { color: var(--faint); font-size: 13px; line-height: 1.4; }
.list { overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 54px; border-top: 1px solid var(--line); text-align: left; width: 100%; font-size: 16px; }
.item:first-child { border-top: 0; }
.item i { width: 14px; height: 14px; border-radius: 5px; display: inline-block; margin-right: 12px; vertical-align: -2px; box-shadow: inset 0 -2px 0 #0003, inset 0 1px 0 #fff5; }
.item .k { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 15px; }
.field { display: flex; align-items: center; gap: 10px; background: #111013; border-radius: 16px; min-height: 50px; padding: 0 14px; box-shadow: inset 0 2px 6px #000c, inset 0 -1px 0 #ffffff0d; }
.field input { flex: 1; background: none; border: 0; color: var(--ivory); font: 500 16px var(--body); outline: none; min-width: 0; }
.field input::placeholder { color: var(--faint); }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.facts div { background: #232227; border-radius: 14px; padding: 10px; text-align: center; }
.facts b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.facts span { font-size: 11px; color: var(--dim); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.parts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; padding: 4px 0 6px; }
/* coach */
.chat { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 120px; flex: 1; padding: 2px 2px 6px; }
.bubble { max-width: 88%; padding: 11px 14px; border-radius: 20px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
.bubble.me { align-self: flex-end; background: var(--ivory); color: #221f24; border-bottom-right-radius: 6px; font-weight: 600; }
.bubble.coach { align-self: flex-start; background: #26252a; border-bottom-left-radius: 6px; box-shadow: inset 0 1px 0 #ffffff12; }
.bubble.wait { color: var(--dim); }
.asks { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; flex: none; scrollbar-width: none; }
.asks::-webkit-scrollbar { display: none; }
.ask { flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; background: #26252a; font-size: 14px; font-weight: 700; box-shadow: inset 0 1px 0 #ffffff12, 0 3px 0 #0008; }
.ask:active { transform: translateY(2px); box-shadow: inset 0 1px 0 #ffffff12, 0 1px 0 #0008; }
.send { min-width: 44px; min-height: 44px; border-radius: 22px; display: grid; place-items: center; background: var(--terra); color: #1d0d06; }
.send[disabled] { opacity: .4; }
.toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 30; transform: translate(-50%, -100px); background: var(--ivory); color: #221f24; font-weight: 700; font-size: 14px; padding: 6px 6px 6px 16px; border-radius: 999px; white-space: nowrap; display: flex; align-items: center; gap: 10px; min-height: 32px; box-shadow: 0 10px 24px #000a; }
.toast button { min-height: 32px; padding: 0 12px; border-radius: 16px; background: #221f24; color: var(--ivory); font-weight: 800; font-size: 13px; }
.toast:not(.undo) { padding: 8px 16px; }
.toast:not(.undo) button { display: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 14px; z-index: 40; background: var(--night); transition: opacity .5s; }
.loading.done { opacity: 0; pointer-events: none; }
.err { color: var(--terra); max-width: 280px; text-align: center; line-height: 1.45; }
@media (prefers-reduced-motion: reduce) { .scrim, .hint { transition: none; } }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as CANNON from 'cannon-es';

const $ = (s) => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const now = () => performance.now() / 1000;

// ---------- the sample day (labelled as such on screen) ----------
const FOODS = [
  { name: 'Greek yogurt 170 g', kcal: 146, p: 20, c: 6, f: 4 },
  { name: 'Banana', kcal: 105, p: 1, c: 27, f: 0 },
  { name: 'Chicken breast 150 g', kcal: 248, p: 46, c: 0, f: 5 },
  { name: 'Rice 200 g', kcal: 260, p: 5, c: 57, f: 1 },
  { name: 'Protein bar', kcal: 190, p: 21, c: 22, f: 8 },
  { name: 'Salmon 150 g', kcal: 312, p: 33, c: 0, f: 19 },
  { name: 'Peanut butter 2 tbsp', kcal: 190, p: 7, c: 7, f: 16 },
  { name: 'Avocado toast', kcal: 260, p: 7, c: 26, f: 15 },
  { name: 'Eggs, two', kcal: 156, p: 13, c: 1, f: 11 },
  { name: 'Oats with milk', kcal: 320, p: 13, c: 50, f: 8 },
  { name: 'Pasta bowl', kcal: 560, p: 18, c: 96, f: 11 },
  { name: 'Apple', kcal: 95, p: 0, c: 25, f: 0 },
];
const COACH = { Legs: 180, Back: 150, Chest: 150, Shoulders: 120, Arms: 90, Core: 60 };
// The Night food clays (night_kit.py FOODS)
const TINT = { c: 0xD9A85B, p: 0xB0704A, f: 0xEFE3C8, m: 0xCDBDA6, q: 0xE3CB98 };
const TINT_NAME = { c: 'Mostly carbs', p: 'Mostly protein', f: 'Mostly fat', m: 'Mixed', q: 'Quick add, macros unknown' };
const S = {
  tab: 'food', target: 2400, protein: 160,
  eaten: [{ ...FOODS[9] }, { ...FOODS[2] }, { ...FOODS[3] }],
  part: 'Legs', secs: 180,
  rest: null,              // {start, end, part, secs, added}
  rests: [],               // finished and running rests today, for the coach
  weights: [82.6, 82.3, 82.4, 81.9, 81.7, 81.5, 81.0, 80.8, 80.9, 80.6, 80.4, 80.1],
  sound: true, turned: { food: false, rest: false },

const kcalEaten = () => S.eaten.reduce((a, e) => a + e.kcal, 0);
const sum = (k) => S.eaten.reduce((a, e) => a + (e[k] || 0), 0);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const mmss = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const kind = (e) => {
  if (!e.p && !e.c && !e.f) return 'q';
  const v = { p: e.p * 4, c: e.c * 4, f: e.f * 9 }, tot = v.p + v.c + v.f;
  const top = Object.keys(v).sort((a, b) => v[b] - v[a])[0];
  return v[top] / tot < 0.5 ? 'm' : top;
};
const hex = (n) => '#' + n.toString(16).padStart(6, '0');

let toastT;
function toast(m, undo) {
  const t = $('#toast'); $('#toastText').textContent = m; t.classList.toggle('undo', !!undo);
  $('#undo').onclick = undo ? () => { undo(); hideToast(); } : null;
  toastTarget = 0; clearTimeout(toastT); toastT = setTimeout(hideToast, undo ? 4000 : 1900);
}
function hideToast() { toastTarget = -100; }
let toastY = -100, toastV = 0, toastTarget = -100;
// Damped springs, stepped finely so a slow frame never makes them overshoot.
function spring(x, v, target, k, c, dt) {
  const n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n;
  for (let i = 0; i < n; i++) { v += (-k * (x - target) - c * v) * h; x += v * h; }
  return [x, v];
}

// ---------- sound: synthesised clay knocks, glass clinks, sand ----------
let actx = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
let lastKnock = 0;
function knock(strength, glass) {
  if (!S.sound || !actx) return;
  const t = actx.currentTime; if (t - lastKnock < 0.03) return; lastKnock = t;
  const g = actx.createGain(), o = actx.createOscillator(), f = actx.createBiquadFilter();
  const vol = Math.min(0.45, strength * 0.1);
  o.type = glass ? 'sine' : 'triangle';
  o.frequency.setValueAtTime(glass ? 1800 + Math.random() * 500 : 170 + Math.random() * 70, t);
  o.frequency.exponentialRampToValueAtTime(glass ? 1450 : 85, t + (glass ? 0.25 : 0.09));
  f.type = 'lowpass'; f.frequency.value = glass ? 6000 : 800;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + (glass ? 0.4 : 0.14));
  o.connect(f); f.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.45);
}
let hiss = null;
function sandHiss(level) {
  if (!actx) return;
  if (!hiss) {
    const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = 0.8;
    const g = actx.createGain(); g.gain.value = 0; src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
    hiss = g;
  }
  hiss.gain.setTargetAtTime(S.sound ? level * 0.03 : 0, actx.currentTime, 0.08);
}

// ---------- assets ----------
const getJSON = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); };
const b64 = (s) => { const bin = atob(s), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return bytes.buffer; };
let UI, jarGL, glassGL, envData;
try {
  const loader = new GLTFLoader();
  const parse = (buf) => new Promise((res, rej) => loader.parse(buf, '', res, rej));
  const [ui, j, h, e] = await Promise.all([getJSON('desk-ui.json'), getJSON('jar.json'), getJSON('hourglass.json'), getJSON('env.json')]);
  UI = ui;
  [jarGL, glassGL] = await Promise.all([parse(b64(j.glb)), parse(b64(h.glb))]);
  envData = new RGBELoader().parse(b64(e.hdr));
} catch (err) {
  $('#loading').innerHTML = '<div class="err">The desk did not load. Reload the page; if it keeps happening, tell Claude what your phone shows.</div>';
  throw err;
}

// ---------- clay controls from the Blender pictures ----------
// Each picture holds the object and its shadow; the slice keeps the round ends.
// The layout box is the object itself (negative margins), so controls line up.
function bg(name) {
  // three pictures: caps fixed, the middle stretched under them by a point each side
  const s = UI.sprites[name], [, l, , r] = s.slice, [, , , ph] = s.rect;
  return `url(${name}-l@3x.png) left top / ${l}px ${ph}px no-repeat, url(${name}-r@3x.png) right top / ${r}px ${ph}px no-repeat, url(${name}-m@3x.png) ${l - 1}px 0 / calc(100% - ${l + r - 2}px) ${ph}px no-repeat`;
}
function skinCSS() {
  let css = '';
  const one = (sel, name, down) => {
    const s = UI.sprites[name], [ol, ot, ow, oh] = s.object, [, , pw, ph] = s.rect;
    const mr = pw - ol - ow, mb = ph - ot - oh;
    css += `${sel}{background:${bg(name)};height:${ph}px;margin:${-ot}px ${-mr}px ${-mb}px ${-ol}px;padding:${ot}px ${mr}px ${mb}px ${ol}px;box-sizing:border-box}`;
    if (down) css += `${sel}:active:not([disabled]){background:${bg(down)}}`;
  };
  one('.clay.primary', 'desk-ui-primary', 'desk-ui-primary-down');
  one('.clay.soft', 'desk-ui-soft', 'desk-ui-soft-down');
  one('.clay.chip', 'desk-ui-chip', 'desk-ui-chip-down');
  one('.clay.chip.on', 'desk-ui-chip-on');
  const style = document.createElement('style'); style.textContent = css; document.head.appendChild(style);
  sliced($('#wellPic'), 'desk-ui-well', $('#tabs').clientWidth);
  document.querySelectorAll('.coach .puck img').forEach((img, i) => {
    const s = UI.sprites[i ? 'desk-ui-coach-down' : 'desk-ui-coach'];
    img.src = (i ? 'desk-ui-coach-down' : 'desk-ui-coach') + '@3x.png';
    img.style.cssText = `left:${-s.object[0]}px;top:${-s.object[1]}px;width:${s.rect[2]}px;height:${s.rect[3]}px`;
  });
}
// A sliced picture behind an element: `width` is the object's width; the
// picture adds its shadow margins round it.
function sliced(el, name, width) {

const RULES = (d) => `You are the coach inside GYM, a personal iPhone app for food logging and rest timing between sets. Speak to the user directly, warm and plain, like a good human coach texting. Use only the data below; never invent other numbers. Keep each answer to 2-4 short sentences with concrete numbers and one clear suggestion. No headings or bullet lists. If asked something the data can't answer, say what you'd need.\n\nToday's data (JSON):\n${JSON.stringify(d)}`;
const ASKS = ['How is today going?', 'What should I eat tonight?', 'How long should I rest for legs?', 'Am I on track this month?'];
function bubble(cls, text) { const el = document.createElement('div'); el.className = 'bubble ' + cls; el.textContent = text; $('#chat').appendChild(el); $('#chat').scrollTop = 1e6; return el; }
function openCoach() {
  openSheet(`<div class="top"><h2>Coach <span class="tag" style="vertical-align:3px;margin-left:6px">sample day</span></h2>${X}</div>
    <div class="chat" id="chat"></div>
    <div class="asks" id="asks">${ASKS.map((a) => `<button class="ask">${a}</button>`).join('')}</div>
    <form class="field" id="askForm" style="padding-right:4px"><input id="askIn" placeholder="Ask your coach" autocomplete="off" enterkeyhint="send"><button class="send" id="sendBtn" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></form>`, () => {
    sheet.style.height = '78%';
    if (!chat.length) bubble('coach', `Hi. I can see today's food, your rests and your weight trend. Ask me anything, or tap a question.`);
    for (const t of chat) bubble(t.role === 'user' ? 'me' : 'coach', t.content);
    sheet.querySelectorAll('.ask').forEach((b) => b.addEventListener('click', () => ask(b.textContent)));
    $('#askForm').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#askIn').value.trim(); if (v) { $('#askIn').value = ''; ask(v); } });
  });
  onClose = () => { sheet.style.height = ''; if (asking) asking.abort(); };
}
async function ask(q) {
  if (asking) return;
  bubble('me', q); chat.push({ role: 'user', content: q });
  const out = bubble('coach wait', 'Thinking…');
  if (!sampleFn) {
    out.classList.remove('wait');
    out.textContent = 'The coach needs Claude, which this page can only reach inside the Claude app. In GYM it will use your own Claude API key once you add one.';
    chat.pop(); return;
  }
  asking = new AbortController(); $('#sendBtn').disabled = true;
  try {
    const turns = [{ role: 'user', content: RULES(dayData()) }, { role: 'assistant', content: 'Got it. I have today\'s data.' }, ...chat.slice(-8)];
    const { text } = await sampleFn(turns, { cache: false, signal: asking.signal, modelTier: 'quick', onText: ({ text }) => { out.classList.remove('wait'); out.textContent = text; $('#chat').scrollTop = 1e6; } });
    out.classList.remove('wait'); out.textContent = text; chat.push({ role: 'assistant', content: text });
  } catch (e) {
    out.classList.remove('wait');
    out.textContent = e.text || ({ not_granted: 'The coach needs your permission to ask Claude. Tap a question again to allow it.', rate_limited: 'Too many questions at once. Try again in a minute.', cancelled: '…' }[e.code] || 'The coach could not answer just now.');
    chat.pop();
  } finally { asking = null; const s = $('#sendBtn'); if (s) s.disabled = false; }
}
$('#coachBtn').addEventListener('click', () => { knock(0.9, false); openCoach(); });

const FIXED = 1 / 240; let acc = 0, last = performance.now();
const G = new THREE.Vector3(0, -9.82, 0);
const jarPos = new THREE.Vector3(), jarVel = new THREE.Vector3(), jarAcc = new THREE.Vector3(), wPrev = new THREE.Vector3(), alpha = new THREE.Vector3();
const gravL = new THREE.Vector3(), spinL = new THREE.Vector3(), spinUpL = new THREE.Vector3(), qi = new THREE.Quaternion(), r3 = new THREE.Vector3(), v3 = new THREE.Vector3(), f3 = new THREE.Vector3(), t3 = new THREE.Vector3();
let jarPrimed = false;
function physicsStep() {
  jar.held.step(FIXED); glass.held.step(FIXED);
  wPrev.copy(jar.held.w);
  jar.held.integrate(FIXED); glass.held.integrate(FIXED);
  // the jar's motion in the room
  const p = new THREE.Vector3(jar.held.x, jar.held.baseY + jar.held.lift, 0);
  if (!jarPrimed) { jarPos.copy(p); jarPrimed = true; }
  const v = p.clone().sub(jarPos).divideScalar(FIXED);
  jarAcc.copy(v).sub(jarVel).divideScalar(FIXED); if (jarAcc.length() > 80) jarAcc.setLength(80);
  jarVel.copy(v); jarPos.copy(p);
  alpha.copy(jar.held.w).sub(wPrev).divideScalar(FIXED); if (alpha.length() > 400) alpha.setLength(400);
  // ...as seen from inside it
  qi.copy(jar.held.q).invert();
  gravL.copy(G).sub(jarAcc).applyQuaternion(qi);
  spinL.copy(jar.held.w).applyQuaternion(qi); spinUpL.copy(alpha).applyQuaternion(qi);
  const moving = jar.held.w.lengthSq() > 0.003 || jarAcc.lengthSq() > 0.25;
  for (const b of blocks) {
    const B = b.body; if (moving) B.wakeUp();
    r3.set(B.position.x, B.position.y, B.position.z); v3.set(B.velocity.x, B.velocity.y, B.velocity.z);
    f3.copy(gravL)
      .sub(t3.crossVectors(spinUpL, r3))
      .sub(t3.crossVectors(spinL, t3.clone().crossVectors(spinL, r3)))
      .sub(t3.crossVectors(spinL, v3).multiplyScalar(2))
      .multiplyScalar(B.mass);
    B.force.x += f3.x; B.force.y += f3.y; B.force.z += f3.z;
  }
  world.step(FIXED);
  keepInside();
}
// ---------- start: settle the sample jar before anyone sees it ----------
jar.group.updateMatrixWorld(true);
S.eaten.forEach((f) => addBlock(f, { settle: true }));
for (let i = 0; i < 600; i++) physicsStep();
glass.held.x = glass.held.xTarget = 1.3;
setTab('food');

function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  [sheetY, sheetV] = spring(sheetY, sheetV, sheetTarget, 320, 34, dt); if (reduceMotion) sheetY = sheetTarget;
  sheet.style.transform = `translateY(${sheetY.toFixed(2)}%)`;
  [toastY, toastV] = spring(toastY, toastV, toastTarget, 300, 26, dt); if (reduceMotion) toastY = toastTarget;
  $('#toast').style.transform = `translate(-50%, ${toastY.toFixed(1)}px)`;
  placeKnob(dt);
  acc += dt; let n = 0;
  while (acc >= FIXED && n < 12) { physicsStep(); acc -= FIXED; n++; }
  if (n === 12) acc = 0;
  jar.held.apply(); glass.held.apply();
  jar.group.updateMatrixWorld(true); glass.group.updateMatrixWorld(true);
  // blocks from the jar's frame into the room
  for (const b of blocks) { b.mesh.position.copy(b.body.position).applyMatrix4(jar.group.matrixWorld); b.mesh.quaternion.copy(b.body.quaternion).premultiply(jar.group.quaternion); }
  for (const o of [jar, glass]) { o.blob.position.x = o.held.x; o.blob.material.opacity = Math.max(0, 1 - o.held.lift * 14); }
  stepSand(dt);
  updateHero(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
renderHead();
window.__desk = { removeBlock, escapeLog, jarBody, physicsStep, keepInside, S, blocks, jar, glass, world, IN, eat, setTab, turnGlass, get escapes() { return escapes; }, renderer, scene, camera, key, startRest };
requestAnimationFrame((t) => { last = t; $('#loading').classList.add('done'); showHint(); requestAnimationFrame(frame); });
</script>
