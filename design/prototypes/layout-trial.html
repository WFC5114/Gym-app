<title>GYM Layout Trial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: a switcher over one phone screen; three layouts render the same sample day. Night palette (Wei's pick): graphite trays, ivory, terracotta. Single dark look on purpose (the app lives on black). */
:root {
  --bg: #050506;
  --tray: #18181a;
  --tray-2: #222225;
  --line: #2e2e32;
  --ivory: #ece6da;
  --dim: #9b958b;
  --faint: #66625c;
  --terra: #d26b43;
  --terra-soft: #d26b4326;
  --brass: #c7a256;
  --good: #8db97a;
  --protein: #d98f6b;
  --carb: #d9c27a;
  --fat: #8fb0c9;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --r: 22px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ivory); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--terra); outline-offset: 2px; }
.top { width: min(100%, 420px); display: flex; flex-direction: column; gap: 8px; }
.switch { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--tray); border-radius: 14px; padding: 4px; gap: 4px; }
.switch button { padding: 9px 4px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--dim); min-height: 44px; }
.switch button[aria-pressed="true"] { background: var(--ivory); color: #111; }
.caption { font-size: 13px; color: var(--dim); line-height: 1.4; min-height: 2.8em; text-wrap: pretty; }
.caption b { color: var(--ivory); font-weight: 600; }
.tag { display: inline-block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); border: 1px solid #c7a25655; border-radius: 6px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }

.phone {
  position: relative; width: min(100%, 420px); flex: 1 1 auto; min-height: 560px;
  background: #000; border-radius: 34px; overflow: hidden; border: 1px solid var(--line);
}
@media (min-width: 700px) { .phone { flex: none; height: 820px; } }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.screen.with-tabs { padding-bottom: 104px; }
.screen > *, .hero > * { flex-shrink: 0; }

/* shared pieces */
.label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.card { background: var(--tray); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 1px 0 #ffffff0d, 0 6px 18px #0008; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.big { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }
.unit { font-size: 13px; color: var(--dim); font-weight: 500; }
.btn { min-height: 52px; border-radius: 16px; padding: 0 18px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--terra); color: #160a05; box-shadow: inset 0 1px 0 #ffffff40, 0 4px 0 #8a3f22; }
.btn.primary:active { transform: translateY(3px); box-shadow: inset 0 1px 0 #ffffff40, 0 1px 0 #8a3f22; }
.btn.soft { background: var(--tray-2); color: var(--ivory); box-shadow: inset 0 1px 0 #ffffff12; }
.btn.soft:active { background: var(--line); }
.btn.wide { width: 100%; }
.btn.huge { min-height: 72px; font-size: 20px; border-radius: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--tray-2); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ivory); color: #111; }
.chip small { font-weight: 500; opacity: .7; }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; background: var(--tray-2); border-radius: 16px; }
.stepper button { min-height: 52px; font-size: 22px; font-weight: 600; }
.stepper .val { text-align: center; font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bar .track { height: 8px; border-radius: 4px; background: var(--tray-2); overflow: hidden; margin-top: 6px; }
.bar .fill { height: 100%; border-radius: 4px; transition: width .4s cubic-bezier(.3,1.4,.5,1); }
.bar .nums { font-size: 12px; color: var(--dim); margin-top: 4px; font-variant-numeric: tabular-nums; }
.bar .nm { font-size: 12px; font-weight: 600; }
.list { display: flex; flex-direction: column; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); min-height: 44px; }
.item:first-child { border-top: 0; }
.item .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 12px; color: var(--dim); }
.item .k { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.muted { color: var(--dim); font-size: 13px; }
.note { font-size: 12px; color: var(--faint); text-align: center; }

/* food field (looks like search, opens the sheet) */
.field { display: flex; align-items: center; gap: 10px; background: var(--tray-2); border-radius: 16px; min-height: 52px; padding: 0 6px 0 16px; color: var(--dim); text-align: left; width: 100%; }
.field .ph { flex: 1; }
.field .scan { min-width: 44px; min-height: 44px; border-radius: 12px; background: var(--tray); display: grid; place-items: center; color: var(--ivory); }

/* rest ring */
.ring { position: relative; display: grid; place-items: center; margin: 4px auto; }
.ring svg { display: block; }
.ring .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .mid .big { font-size: 44px; }

/* jar (B) */
.jar { position: relative; width: 150px; height: 210px; margin: 0 auto; border-radius: 26px 26px 34px 34px; border: 3px solid #ece6da55; background: #ffffff06; overflow: hidden; }
.jar .lvl { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#d26b43, #a9502f); transition: height .5s cubic-bezier(.3,1.35,.5,1); }
.jar .target { position: absolute; left: -2px; right: -2px; border-top: 2px dashed var(--ivory); }
.jar .target i { position: absolute; right: 6px; top: -18px; font-size: 10px; letter-spacing: .1em; font-style: normal; color: var(--ivory); }

/* tab bar (B) */
.tabs { position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: repeat(3, 1fr); background: #141416ee; backdrop-filter: blur(10px); border-radius: 24px; padding: 6px; border: 1px solid var(--line); }
.tabs button { min-height: 60px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 13px; font-weight: 700; color: var(--dim); }
.tabs button[aria-pressed="true"] { background: var(--tray-2); color: var(--ivory); }
.tabs svg { width: 24px; height: 24px; }

/* now (C) */
.ctx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ctx button { min-height: 44px; border-radius: 12px; background: var(--tray); font-size: 13px; font-weight: 600; color: var(--dim); }
.ctx button[aria-pressed="true"] { color: var(--ivory); box-shadow: inset 0 0 0 1.5px var(--ivory); }
.hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; text-align: center; padding: 6px 4px; }
.hero .big { font-size: 64px; }
.dock { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.dock button { min-height: 64px; border-radius: 20px; background: var(--tray); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 700; }
.dock button span { font-size: 11px; color: var(--dim); font-weight: 500; }

/* sheet */
.scrim { position: absolute; inset: 0; background: #000a; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 5; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 86%; background: var(--tray); border-radius: 28px 28px 0 0; z-index: 6; transform: translateY(105%); display: flex; flex-direction: column; padding: 10px 16px 16px; gap: 12px; box-shadow: 0 -10px 30px #000c; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 2px; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; min-height: 50px; border-radius: 14px; border: 0; background: var(--tray-2); color: var(--ivory); font: inherit; font-size: 16px; padding: 0 14px; }
.search input::placeholder { color: var(--faint); }
.results { flex: 1; overflow-y: auto; }
.results .item { width: 100%; text-align: left; }
.pick { display: flex; flex-direction: column; gap: 12px; }
.toast { position: absolute; left: 50%; top: 14px; transform: translate(-50%, -80px); background: var(--ivory); color: #111; font-weight: 700; padding: 10px 16px; border-radius: 999px; z-index: 9; font-size: 14px; white-space: nowrap; transition: transform .35s cubic-bezier(.3,1.5,.5,1); }
.toast.on { transform: translate(-50%, 0); }
.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.94); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
.spark text { fill: var(--dim); font-size: 10px; font-family: var(--body); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="top">
  <div class="switch" role="group" aria-label="Layout">
    <button id="sw-a" data-layout="a" aria-pressed="true">A · Today</button>
    <button id="sw-b" data-layout="b" aria-pressed="false">B · Tabs</button>
    <button id="sw-c" data-layout="c" aria-pressed="false">C · Now</button>
  </div>
  <div class="caption" id="caption"></div>
</div>

<div class="phone" id="phone">
  <div class="screen" id="screen"></div>
  <div class="scrim" id="scrim" data-act="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Log food">
    <div class="grab"></div>
    <div class="row between"><strong style="font-size:18px">Log food</strong><button class="btn soft" style="min-height:44px" data-act="close-sheet">Close</button></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search a food or brand" autocomplete="off">
      <button class="btn soft" style="min-width:52px;padding:0" data-act="scan" aria-label="Scan barcode">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
      </button>
    </div>
    <div id="sheetBody" class="results"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<div class="note">Layout trial with sample data. The final look comes from Blender; this is only about what's obvious to use.</div>

<script>
(() => {
  // ---------- sample day (labelled as sample in the UI) ----------
  const FOODS = [
    { name: "Greek yogurt 2%", brand: "Fage", per: "170 g", kcal: 146, p: 20, c: 6, f: 4 },
    { name: "Banana", brand: "", per: "1 medium", kcal: 105, p: 1, c: 27, f: 0 },
    { name: "Chicken breast, grilled", brand: "", per: "150 g", kcal: 248, p: 46, c: 0, f: 5 },
    { name: "White rice, cooked", brand: "", per: "200 g", kcal: 260, p: 5, c: 57, f: 1 },
    { name: "Protein bar", brand: "Quest", per: "1 bar", kcal: 190, p: 21, c: 22, f: 8 },
    { name: "Oats with milk", brand: "", per: "1 bowl", kcal: 320, p: 13, c: 50, f: 8 },
    { name: "Eggs, scrambled", brand: "", per: "2 eggs", kcal: 182, p: 12, c: 2, f: 14 },
    { name: "Salmon fillet", brand: "", per: "150 g", kcal: 312, p: 33, c: 0, f: 19 },
    { name: "Whey shake", brand: "Optimum Nutrition", per: "1 scoop", kcal: 120, p: 24, c: 3, f: 1 },
    { name: "Avocado toast", brand: "", per: "1 slice", kcal: 260, p: 7, c: 26, f: 15 },
    { name: "Coca-Cola", brand: "Coca-Cola", per: "330 ml", kcal: 139, p: 0, c: 35, f: 0 },
    { name: "Peanut butter", brand: "Skippy", per: "2 tbsp", kcal: 190, p: 7, c: 7, f: 16 },
  ];
  const COACH = { Legs: 180, Back: 150, Chest: 150, Shoulders: 120, Arms: 90, Core: 60 };
  const S = {
    layout: "a", tab: "food", ctx: "gym",
    target: 2400, macroT: { p: 170, c: 260, f: 75 },
    eaten: [
      { name: "Oats with milk", kcal: 320, p: 13, c: 50, f: 8, at: "08:10" },
      { name: "Chicken breast, grilled", kcal: 248, p: 46, c: 0, f: 5, at: "12:40" },
      { name: "White rice, cooked", kcal: 260, p: 5, c: 57, f: 1, at: "12:40" },
    ],
    part: "Legs", secs: 180, run: null, rests: [],
    weights: [82.6, 82.3, 82.4, 81.9, 81.7, 81.5, 81.0, 80.8, 80.9, 80.6, 80.4, 80.1],
    fat: 19.8, sheetPick: null, sheetServ: 1,
  };
  try { const l = localStorage.getItem("gym-layout"); if (l && "abc".includes(l)) S.layout = l; } catch (e) {}

  const $ = (s) => document.querySelector(s);
  const screen = $("#screen"), sheet = $("#sheet"), scrim = $("#scrim");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // damped spring (mass 1), the motion the app uses
  function spring(from, to, k, c, on, done) {
    if (reduce) { on(to); done && done(); return; }
    let x = from, v = 0, last = performance.now();
    function step(t) {
      const dt = Math.min(0.032, (t - last) / 1000); last = t;
      v += (-k * (x - to) - c * v) * dt; x += v * dt; on(x);
      if (Math.abs(v) < 0.02 && Math.abs(x - to) < 0.05) { on(to); done && done(); return; }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  const sum = (k) => S.eaten.reduce((a, e) => a + e[k], 0);
  const left = () => S.target - sum("kcal");
  const fmt = (n) => Math.round(n).toLocaleString("en-US");
  const mmss = (s) => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const remaining = () => S.run ? (S.run.end - Date.now()) / 1000 : S.secs;
  const restsFor = (p) => S.rests.filter((r) => r.part === p).length;

  let toastT;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800);
  }

  // ---------- shared blocks ----------
  function macroBars() {
    const m = [["Protein", "p", "--protein"], ["Carbs", "c", "--carb"], ["Fat", "f", "--fat"]];
    return `<div class="bars">${m.map(([n, k, col]) => {
      const v = sum(k), t = S.macroT[k];
      return `<div class="bar"><div class="nm">${n}</div><div class="track"><div class="fill" style="width:${Math.min(100, v / t * 100)}%;background:var(${col})"></div></div><div class="nums">${v} / ${t} g</div></div>`;
    }).join("")}</div>`;
  }
  function foodField() {
    return `<button class="field" data-act="open-sheet"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="ph">Search a food or brand</span><span class="scan" data-act="scan" aria-label="Scan barcode"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></span></button>`;
  }
  function quickAdd() {
    return `<div class="chips">${[100, 250, 500].map((k) => `<button class="chip" data-act="quick" data-k="${k}">+${k} <small>kcal</small></button>`).join("")}</div>`;
  }
  function eatenList(n) {
    const items = S.eaten.slice().reverse().slice(0, n || 99);
    return `<div class="list">${items.map((e) => `<div class="item"><div style="min-width:0"><div class="t">${e.name}</div><div class="s">${e.at}</div></div><div class="k">${e.kcal} kcal</div></div>`).join("")}</div>`;
  }
  function partChips() {
    return `<div class="chips">${Object.keys(COACH).map((p) => `<button class="chip" data-act="part" data-p="${p}" aria-pressed="${S.part === p}">${p}${restsFor(p) ? ` <small>${restsFor(p)}</small>` : ""}</button>`).join("")}</div>`;
  }
  function ring(size, stroke) {
    const r = (size - stroke) / 2, C = 2 * Math.PI * r;
    const total = S.run ? S.run.total : S.secs;
    const frac = S.run ? Math.max(0, remaining()) / total : 1;
    return `<div class="ring" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--tray-2)" stroke-width="${stroke}"/>
      <circle data-ring cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${S.run ? "var(--terra)" : "var(--ivory)"}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" transform="rotate(-90 ${size / 2} ${size / 2})" data-c="${C}"/></svg>
      <div class="mid"><div><div class="big" data-timer>${mmss(remaining())}</div><div class="muted" style="margin-top:6px">${S.run ? "resting · " + S.part : S.part + " · coach " + mmss(COACH[S.part])}</div></div></div></div>`;
  }
  function restControls() {
    if (S.run) return `<div class="row"><button class="btn soft" style="flex:1" data-act="add30">+30 s</button><button class="btn soft" style="flex:1" data-act="stop">End rest</button></div>`;
    return `<div class="stepper"><button data-act="minus" aria-label="15 seconds less">−</button><div class="val">${mmss(S.secs)}</div><button data-act="plus" aria-label="15 seconds more">+</button></div>
      <button class="btn primary wide" data-act="start">Start rest</button>`;
  }
  function spark(w, h) {
    const ws = S.weights, lo = Math.floor(Math.min(...ws) - 0.5), hi = Math.ceil(Math.max(...ws) + 0.5);
    const padL = 30, padB = 16, padT = 8, iw = w - padL - 6, ih = h - padB - padT;
    const x = (i) => padL + i / (ws.length - 1) * iw, y = (v) => padT + (hi - v) / (hi - lo) * ih;
    const pts = ws.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const area = `M${x(0)},${padT + ih} L${pts.split(" ").join(" L")} L${x(ws.length - 1)},${padT + ih} Z`;
    const ticks = [hi, (hi + lo) / 2, lo];
    return `<svg class="spark" width="100%" viewBox="0 0 ${w} ${h}" role="img" aria-label="Weight over 12 weeks, sample data">
      ${ticks.map((t) => `<line x1="${padL}" x2="${w - 6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="0" y="${y(t) + 3}">${t.toFixed(t % 1 ? 1 : 0)}</text>`).join("")}
      <path d="${area}" fill="#d26b4322"/><polyline points="${pts}" fill="none" stroke="var(--terra)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(ws.length - 1)}" cy="${y(ws[ws.length - 1])}" r="4.5" fill="var(--ivory)"/>
      <text x="${padL}" y="${h - 2}">12 wk ago</text><text x="${w - 6}" y="${h - 2}" text-anchor="end">now</text></svg>`;
  }
  function weightBlock() {
    const ws = S.weights, now = ws[ws.length - 1], d = now - ws[ws.length - 5];
    return `<div class="row between"><div><div class="label">Weight</div><div class="row" style="gap:6px;align-items:baseline;margin-top:6px"><span class="big" style="font-size:34px">${now.toFixed(1)}</span><span class="unit">kg</span></div></div>
      <div style="text-align:right"><div class="label">4 weeks</div><div style="margin-top:8px;font-weight:700;color:${d <= 0 ? "var(--good)" : "var(--terra)"}">${d > 0 ? "+" : "−"}${Math.abs(d).toFixed(1)} kg</div><div class="muted">Body fat ${S.fat}%</div></div></div>${spark(340, 120)}`;
  }

  // ---------- layout A: Today ----------
  function viewA() {
    return `<div class="row between"><div><div class="label">Thursday</div><div style="font-size:22px;font-weight:700;margin-top:2px">Today</div></div><span class="tag">sample</span></div>
    <section class="card">
      <div class="row between" style="align-items:flex-end"><div><div class="label">Left to eat</div><div class="row" style="gap:6px;align-items:baseline;margin-top:8px"><span class="big" data-left style="font-size:52px">${fmt(left())}</span><span class="unit">of ${fmt(S.target)} kcal</span></div></div></div>
      ${macroBars()}
      ${foodField()}
      ${quickAdd()}
      <details><summary class="muted" style="cursor:pointer;min-height:32px">Eaten today · ${S.eaten.length} items</summary>${eatenList()}</details>
    </section>
    <section class="card">
      <div class="row between"><div class="label">Rest timer</div><div class="muted">${S.rests.length} rests today</div></div>
      ${S.run ? ring(200, 12) : partChips()}
      ${restControls()}
    </section>
    <section class="card">${weightBlock()}<button class="btn soft wide" data-act="weigh">Add today's weight</button></section>`;
  }

  // ---------- layout B: Tabs ----------
  const ICON = {
    food: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 2-2 6 0 8v10"/></svg>',
    rest: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9"/></svg>',
    body: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg>',
  };
  function viewB() {
    let body = "";
    if (S.tab === "food") {
      const pct = Math.min(1.15, sum("kcal") / S.target);
      body = `<div class="row between"><div style="font-size:22px;font-weight:700">Food</div><span class="tag">sample</span></div>
      <div class="jar" aria-label="Eaten ${fmt(sum("kcal"))} of ${fmt(S.target)} kcal"><div class="lvl" style="height:${pct / 1.15 * 100}%"></div><div class="target" style="bottom:${100 / 1.15}%"><i>TARGET</i></div></div>
      <div style="text-align:center"><span class="big" data-left style="font-size:46px">${fmt(left())}</span> <span class="unit">kcal left</span></div>
      ${macroBars()}
      <button class="btn primary huge wide" data-act="open-sheet">Log food</button>
      ${quickAdd()}
      <div class="card" style="padding:4px 16px">${eatenList()}</div>`;
    } else if (S.tab === "rest") {
      body = `<div class="row between"><div style="font-size:22px;font-weight:700">Rest</div><div class="muted">${S.rests.length} rests today</div></div>
      ${ring(240, 14)}
      ${S.run ? "" : partChips()}
      ${restControls()}`;
    } else {
      body = `<div class="row between"><div style="font-size:22px;font-weight:700">Body</div><span class="tag">sample</span></div>
      <div class="card">${weightBlock()}</div>
      <button class="btn primary wide" data-act="weigh">Add today's weight</button>
      <div class="muted">Weight and body fat would come from Apple Health and your InBody scans.</div>`;
    }
    return body;
  }
  function tabsBar() {
    return `<nav class="tabs">${["food", "rest", "body"].map((t) => `<button data-act="tab" data-t="${t}" aria-pressed="${S.tab === t}">${ICON[t]}${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</nav>`;
  }

  // ---------- layout C: Now ----------
  function viewC() {
    let hero = "";
    if (S.ctx === "gym") {
      hero = S.run
        ? `${ring(250, 14)}${restControls()}`
        : `<div><div class="label">Next rest · coach suggests</div><div class="big" style="font-size:64px;margin-top:12px">${mmss(S.secs)}</div><div class="muted" style="margin-top:8px">${S.part} · rest ${restsFor(S.part) + 1} today</div></div>
           ${partChips()}
           <button class="btn primary huge wide" data-act="start">Start rest</button>
           <div class="row" style="justify-content:center"><button class="chip" data-act="minus">−15 s</button><button class="chip" data-act="plus">+15 s</button></div>`;
    } else if (S.ctx === "meal") {
      hero = `<div><div class="label">Left to eat today</div><div class="big" data-left style="font-size:64px;margin-top:12px">${fmt(left())}</div><div class="muted" style="margin-top:8px">kcal of ${fmt(S.target)} · protein ${sum("p")} / ${S.macroT.p} g</div></div>
        <button class="btn primary huge wide" data-act="open-sheet">Log lunch</button>
        <div class="row" style="justify-content:center">${quickAdd()}</div>
        <div class="muted">Last: ${S.eaten[S.eaten.length - 1].name}</div>`;
    } else {
      const ws = S.weights;
      hero = `<div><div class="label">Evening check-in</div><div class="big" style="font-size:64px;margin-top:12px">${ws[ws.length - 1].toFixed(1)}</div><div class="muted" style="margin-top:8px">kg · trend ${(ws[ws.length - 1] - ws[ws.length - 5]).toFixed(1)} kg in 4 weeks</div></div>
        <button class="btn primary huge wide" data-act="weigh">Weigh in</button>
        <div class="card" style="text-align:left"><div class="label">Today</div><div class="row between"><span>Eaten</span><b>${fmt(sum("kcal"))} kcal</b></div><div class="row between"><span>Rests logged</span><b>${S.rests.length}</b></div><div class="row between"><span>Protein</span><b>${sum("p")} g</b></div></div>`;
    }
    return `<div class="row between"><div class="label">Pretend it's</div><span class="tag">sample</span></div>
      <div class="ctx">${[["gym", "At the gym"], ["meal", "Lunchtime"], ["eve", "Evening"]].map(([k, n]) => `<button data-act="ctx" data-k="${k}" aria-pressed="${S.ctx === k}">${n}</button>`).join("")}</div>
      <div class="hero">${hero}</div>
      <div class="dock">
        <button data-act="ctx" data-k="meal">Food<span>${fmt(left())} left</span></button>
        <button data-act="ctx" data-k="gym">Rest<span>${S.run ? mmss(remaining()) : S.part}</span></button>
        <button data-act="ctx" data-k="eve">Body<span>${S.weights[S.weights.length - 1].toFixed(1)} kg</span></button>
      </div>`;
  }

  const CAPTIONS = {
    a: "<b>Today:</b> one scrolling page with food, rest and weight stacked. Everything is visible and labelled, with nothing hidden behind gestures.",
    b: "<b>Tabs:</b> three rooms (Food, Rest, Body) with a tab bar that's always there. Each room has one hero object and one big button at thumb height.",
    c: "<b>Now:</b> GYM shows the one thing you most likely need right now (rest at the gym, logging at lunch, weigh-in at night). The dock jumps to the others.",
  };

  // ---------- render ----------
  function render() {
    document.querySelectorAll("[data-layout]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.layout === S.layout));
    $("#caption").innerHTML = CAPTIONS[S.layout];
    const top = screen.scrollTop;
    screen.classList.toggle("with-tabs", S.layout === "b");
    screen.innerHTML = S.layout === "a" ? viewA() : S.layout === "b" ? viewB() : viewC();
    document.querySelectorAll(".tabs").forEach((t) => t.remove());
    if (S.layout === "b") $("#phone").insertAdjacentHTML("beforeend", tabsBar());
    screen.scrollTop = top;
  }

  function bumpLeft(from) {
    const el = screen.querySelector("[data-left]"); if (!el) return;
    el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    spring(from, left(), 170, 22, (v) => { el.textContent = fmt(v); });
  }

  // ---------- sheet ----------
  let sheetOpen = false;
  function openSheet() {
    sheetOpen = true; S.sheetPick = null; S.sheetServ = 1; $("#q").value = ""; renderSheet();
    scrim.classList.add("on");
    spring(105, 0, 260, 26, (v) => { sheet.style.transform = `translateY(${v}%)`; });
    setTimeout(() => { try { $("#q").focus({ preventScroll: true }); } catch (e) {} }, 250);
  }
  function closeSheet() {
    if (!sheetOpen) return; sheetOpen = false; scrim.classList.remove("on");
    spring(0, 105, 260, 30, (v) => { sheet.style.transform = `translateY(${v}%)`; });
    $("#q").blur();
  }
  function renderSheet() {
    const body = $("#sheetBody");
    if (S.sheetPick != null) {
      const f = FOODS[S.sheetPick], s = S.sheetServ;
      body.innerHTML = `<div class="pick">
        <button class="muted" style="text-align:left;min-height:44px" data-act="back">‹ Back to results</button>
        <div><div style="font-size:20px;font-weight:700">${f.name}</div><div class="muted">${f.brand ? f.brand + " · " : ""}${f.per} per serving</div></div>
        <div class="row" style="gap:6px;align-items:baseline"><span class="big" style="font-size:44px">${fmt(f.kcal * s)}</span><span class="unit">kcal</span></div>
        <div class="muted">Protein ${Math.round(f.p * s)} g · Carbs ${Math.round(f.c * s)} g · Fat ${Math.round(f.f * s)} g</div>
        <div class="label">Servings</div>
        <div class="stepper"><button data-act="serv-" aria-label="Half a serving less">−</button><div class="val">${s}</div><button data-act="serv+" aria-label="Half a serving more">+</button></div>
        <button class="btn primary huge wide" data-act="add-food">Add to today</button></div>`;
      return;
    }
    const q = $("#q").value.trim().toLowerCase();
    const hits = FOODS.map((f, i) => [f, i]).filter(([f]) => !q || (f.name + " " + f.brand).toLowerCase().includes(q));
    body.innerHTML = `<div class="label" style="margin:4px 0 2px">${q ? hits.length + " results" : "Recent and common"} <span class="tag" style="margin-left:6px">sample list</span></div>
      <div class="list">${hits.map(([f, i]) => `<button class="item" data-act="pick" data-i="${i}"><div style="min-width:0"><div class="t">${f.name}</div><div class="s">${f.brand ? f.brand + " · " : ""}${f.per}</div></div><div class="k">${f.kcal}</div></button>`).join("") || `<div class="muted" style="padding:16px 0">No match in the sample list. The app searches Open Food Facts.</div>`}</div>`;
  }
  $("#q").addEventListener("input", () => { S.sheetPick = null; renderSheet(); });

  // ---------- rest timer ----------
  function startRest() {
    const total = S.secs;
    S.run = { start: Date.now(), end: Date.now() + total * 1000, total };
    render(); toast(`Resting · ${S.part} · ${mmss(total)}`);
  }
  function finishRest(early) {
    if (!S.run) return;
    S.rests.push({ part: S.part, secs: Math.round((Date.now() - S.run.start) / 1000) });
    S.run = null; render(); toast(early ? "Rest ended early" : "Rest done. Next set.");
  }
  setInterval(() => {
    if (!S.run) return;
    const r = remaining();
    screen.querySelectorAll("[data-timer]").forEach((el) => { el.textContent = mmss(r); });
    screen.querySelectorAll("[data-ring]").forEach((el) => { el.setAttribute("stroke-dashoffset", (+el.dataset.c * (1 - Math.max(0, r) / S.run.total)).toFixed(1)); });
    const dock = screen.querySelector(".dock button:nth-child(2) span"); if (dock) dock.textContent = mmss(r);
    if (r <= 0) finishRest(false);
  }, 200);

  // ---------- actions ----------
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act],[data-layout]"); if (!el) return;
    if (el.dataset.layout) {
      S.layout = el.dataset.layout; try { localStorage.setItem("gym-layout", S.layout); } catch (e) {}
      screen.scrollTop = 0; render(); return;
    }
    const a = el.dataset.act; const before = left();
    switch (a) {
      case "open-sheet": openSheet(); break;
      case "close-sheet": closeSheet(); break;
      case "scan": ev.stopPropagation(); toast("Barcode scan works in the app, not here"); break;
      case "pick": S.sheetPick = +el.dataset.i; S.sheetServ = 1; renderSheet(); break;
      case "back": S.sheetPick = null; renderSheet(); break;
      case "serv-": S.sheetServ = Math.max(0.5, S.sheetServ - 0.5); renderSheet(); break;
      case "serv+": S.sheetServ = Math.min(6, S.sheetServ + 0.5); renderSheet(); break;
      case "add-food": {
        const f = FOODS[S.sheetPick], s = S.sheetServ, d = new Date();
        S.eaten.push({ name: f.name, kcal: Math.round(f.kcal * s), p: Math.round(f.p * s), c: Math.round(f.c * s), f: Math.round(f.f * s), at: d.toTimeString().slice(0, 5) });
        closeSheet(); render(); bumpLeft(before); toast(`Added ${f.name}`); break;
      }
      case "quick": {
        const k = +el.dataset.k, d = new Date();
        S.eaten.push({ name: `Quick add ${k} kcal`, kcal: k, p: 0, c: 0, f: 0, at: d.toTimeString().slice(0, 5) });
        render(); bumpLeft(before); toast(`+${k} kcal`); break;
      }
      case "part": S.part = el.dataset.p; S.secs = COACH[S.part]; render(); break;
      case "minus": S.secs = Math.max(15, S.secs - 15); render(); break;
      case "plus": S.secs = Math.min(600, S.secs + 15); render(); break;
      case "start": startRest(); break;
      case "add30": if (S.run) { S.run.end += 30000; S.run.total += 30; toast("+30 s added"); } break;
      case "stop": finishRest(true); break;
      case "tab": S.tab = el.dataset.t; screen.scrollTop = 0; render(); break;
      case "ctx": S.ctx = el.dataset.k; screen.scrollTop = 0; render(); break;
      case "weigh": {
        const w = +(S.weights[S.weights.length - 1] - 0.1 - Math.random() * 0.2).toFixed(1);
        S.weights.push(w); S.weights.shift(); render(); toast(`Logged ${w.toFixed(1)} kg (sample)`); break;
      }
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  render();
})();
</script>
